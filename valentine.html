<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffe6f2;
            color: #d63384;
            padding: 50px;
        }
        h1 {
            font-size: 2em;
        }
        .note {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        img {
            width: 300px;
            border-radius: 10px;
            margin: 20px auto; /* Center horizontally and add margin */
            display: none; /* Hide the image initially */
        }
        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
        button {
            font-size: 1.5em;
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #yes {
            background-color: #ff69b4;
            color: white;
        }
        #no {
            background-color: #ccc;
            color: #333;
            /* Removed position: absolute to allow side-by-side layout initially */
        }
        #message {
            font-size: 1.2em;
            margin-top: 20px;
            display: none;
        }
    </style>
    <!-- Added confetti.js library for enhanced confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <h1>Will you be my Valentine?</h1>
    <div class="note">You wouldn't dare to press NO.... would you?</div>
    <div class="button-container">
        <button id="yes">YES</button>
        <button id="no">NO</button>
    </div>
    <div id="message">Good, because I didn't have a plan B.</div>
    <img src="myvalentinephoto.jpg" alt="Your custom photo">

    <audio id="romanticMusic" loop>
        <source src="https://www.soundjay.com/misc/sounds/romantic-piano-01.mp3" type="audio/mpeg"> <!-- Free romantic music; replace if needed -->
    </audio>

    <script>
        const noButton = document.getElementById('no');
        const yesButton = document.getElementById('yes');
        const message = document.getElementById('message');
        const music = document.getElementById('romanticMusic');
        const note = document.querySelector('.note');
        const img = document.querySelector('img');
        let confettiInterval; // For continuous confetti

        // Move NO button on hover (now sets position absolute dynamically)
        noButton.addEventListener('mouseover', () => {
            noButton.style.position = 'absolute'; // Make it absolute only on hover
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        });

        // Show message, play music, start continuous confetti, hide note, hide YES, and show image on YES click
        yesButton.addEventListener('click', () => {
            message.style.display = 'block';
            noButton.style.display = 'none';
            yesButton.style.display = 'none'; // Hide YES button after tap
            note.style.display = 'none'; // Hide the note after YES
            img.style.display = 'block'; // Show the image centered below texts after YES
            music.play(); // Starts the romantic music
            // Start continuous confetti
            confettiInterval = setInterval(() => {
                confetti({
                    particleCount: 50, // Smaller bursts for continuous effect
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff69b4', '#ffe6f2', '#d63384', '#ff1493', '#ffb6c1'] // Pink and red colors for Valentine's theme
                });
            }, 500); // Every 500ms for continuous blowing
        });
    </script>
</body>
</html>
